name: DOS XT 8086 CGA build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GNU as / ld 8086-only static build
        run: make clean all test
      - name: Verify tested v0.8 binary exactly matches rebuilt release
        run: echo "4ad4cfe08e56c5c6d0c1e04855b28b4e8ac9fb727b1d1ca0dd9533ad2b8a117c  dist/SHIPS.COM" | sha256sum -c -
