name: DOS XT 8086 CGA build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GNU as / ld 8086-only static build
        run: make clean all test
      - name: Verify tested v0.8 binary exactly matches rebuilt release
        run: |
          sha256sum dist/SHIPS.COM
          echo "75575e760b0390df7a9fc76bcf29534f1b7f9872aa36aeadb88eb158ec096d60  dist/SHIPS.COM" | sha256sum -c -
